name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar no VS Code Marketplace
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/extensions/DbSqlLikeMem.VsCodeExtension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release readiness (VS Code baseline)
        working-directory: .
        run: python3 scripts/check_release_readiness.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/extensions/DbSqlLikeMem.VsCodeExtension/package-lock.json

      - name: Validate VS Code version source contract
        working-directory: .
        run: |
          if [ ! -f src/extensions/DbSqlLikeMem.VsCodeExtension/package.json ]; then
            echo "Version source file not found: src/extensions/DbSqlLikeMem.VsCodeExtension/package.json" >&2
            exit 1
          fi

          echo "VS Code version source: src/extensions/DbSqlLikeMem.VsCodeExtension/package.json"

      - name: Setup .NET metadata bridge SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Run extension tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Locate VSIX
        id: locate_vsix
        run: |
          VSIX_PATH=$(ls -t *.vsix | head -n 1)
          if [ -z "$VSIX_PATH" ]; then
            echo "Nenhum .vsix foi gerado." >&2
            exit 1
          fi
          echo "path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: src/extensions/DbSqlLikeMem.VsCodeExtension/${{ steps.locate_vsix.outputs.path }}

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Secret VSCE_PAT não configurado." >&2
            exit 1
          fi
          npx --no-install vsce publish --packagePath "${{ steps.locate_vsix.outputs.path }}"
